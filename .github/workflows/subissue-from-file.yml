name: Create subissues for Epic issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create-subissues:
    runs-on: ubuntu-latest

    steps:
      - name: Create Task subissues attached to Epic
        id: get-parent
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            if (!issue.type || issue.type.name !== 'Epic') {
              console.log('Issue is not of type Epic. Skipping.');
              return;
            }

            echo "PARENT_NUM=issue.number" >> $GITHUB_ENV
            console.log('Epic detected. Creating Task subissues...');
      
      - name: Checkout repo
        uses: actions/checkout@v3
        
      - name: Create issue from file
        id: a11y-design
        run: |
          gh issue create --title "Totes auto-created" --body-file .github/ISSUE_TEMPLATE/epics/test.md
          echo "CHILD=${{ github.event.issue }}" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.html_url }}

          
      - name: Attach issue to to Epic
        uses: actions/github-script@v7
        with:
          script: |

            // 2) Link the newly created issue as a sub-issue of the Epic
            await github.request('POST /repos/{owner}/{repo}/issues/{PARENT_NUM}/sub_issues', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{steps.get-parent.outputs.PARENT_NUM}},
              sub_issue_id: ${{steps.a11y-design.outputs.CHILD.id}}
            });

            console.log(`Linked created issue #${created.data.number} as a Task subissue of Epic #${ISSUE_NUM}`);
