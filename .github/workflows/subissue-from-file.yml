name: Create subissues for Epic issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create-subissues:
    runs-on: ubuntu-latest
    if: github.event.issue.type.name == 'Epic'
    env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Save issue URL to env
        run: |
          echo "PARENT_URL=${{ github.event.issue.html_url }}" >> $GITHUB_ENV
          echo "PARENT_NUM=${{ github.event.issue.number }}" >> $GITHUB_ENV
          
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Get parent issue data
        run: |
          echo "REPO=${{ github.repository }}" >> $GITHUB_ENV
          echo "API_URL=/repos/WorkflowsCI/prose-test/issues/$PARENT_NUM/sub_issues" >> $GITHUB_ENV
          echo "BASE_URL=/repos/${{ github.repository }}/issues" >> $GITHUB_ENV
          echo "ADD_SUBISSUE_API=$BASEURL/$PARENT_NUM/sub_issues" >> $GITHUB_ENV
        
      - name: Create issue from file
        run: |
          echo "CHILD=$(gh issue create --title "Autocreated subissue with type task" --body-file ".github/ISSUE_TEMPLATE/epics/test.md")" >> $GITHUB_ENV 
      
      - name: Get Issue Number
        run: |
          echo "CHILD_NUM=$(gh issue view ${{ env.CHILD }} --json number --jq '.number')" >> $GITHUB_ENV

      - name: Get Issue Database ID
        run: |
          echo "CHILD_ID=$(gh api /repos/WorkflowsCI/prose-test/issues/${{ env.CHILD_NUM }} --jq .id)" >> $GITHUB_ENV
          
      - name: Attach issue to to Epic
        run: |
          gh api -X POST $ADD_SUBISSUE_API -F sub_issue_id=$CHILD_ID

      - name: Set subissue type to Task
        run: |
          gh api -X PATCH /repos/WorkflowsCI/prose-test/issues/${{ env.CHILD_NUM }} --field type=Task
