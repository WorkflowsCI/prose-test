name: Create subissues for Epic issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create-subissues:
    runs-on: ubuntu-latest
    if: github.event.issue.type.name == 'Epic'
    env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Get Parent Numbers
        run: echo "PARENT_NUM=github.event.issue.number" >> $GITHUB_ENV
        
      - name: Checkout repo and get parent numbers
        uses: actions/checkout@v3
        
      - name: Create issue from file
        id: a11y-design
        run: |
          echo "CHILD=$(gh issue create --title "Totes auto-created" --body-file ".github/ISSUE_TEMPLATE/epics/test.md")" >> $GITHUB_ENV 
          echo "CHILD_ID=$(gh api $CHILD --jq .id)" >> $GITHUB_ENV
          echo "CHILD_NUM=$(gh api $CHILD --jq .number)" >> $GITHUB_ENV

      - name: Attach issue to to Epic
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: $PARENT_NUM,
                sub_issue_id: $CHILD_ID
              });

              console.log(`Linked created issue #{env.CHILD_NUM} as a Task subissue of Epic #${env.PARENT_NUM}`);
