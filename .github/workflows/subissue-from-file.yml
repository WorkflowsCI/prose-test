name: Create subissues for Epic issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create-subissues:
    runs-on: ubuntu-latest
    if: (issue.type == 'Epic')
    steps:
      - name: Check if Epic
        id: get-parent
        run: echo "PARENT_NUM=context.payload.issue.number" >> $GITHUB_ENV

      - name: Checkout repo
        uses: actions/checkout@v3
        
      - name: Create issue from file
        id: a11y-design
        run: |
          gh issue create --title "Totes auto-created" --body-file .github/ISSUE_TEMPLATE/epics/test.md
          echo "CHILD_ID=${{ github.event.issue.id }}" >> $GITHUB_ENV
          echo "CHILD_NUM=${{ github.event.issue.number }}" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.html_url }}

          
      - name: Attach issue to to Epic
        uses: actions/github-script@v7
        with:
          script: |

            // 2) Link the newly created issue as a sub-issue of the Epic
            await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ env.PARENT_NUM }},
              sub_issue_id: ${{ env.CHILD_ID }}
            });

            console.log(`Linked created issue #${{ env.CHILD_NUM }} as a Task subissue of Epic #${{ env.PARENT_NUM }}`);
