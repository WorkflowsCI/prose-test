name: Create subissues for Epic issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create-subissues:
    runs-on: ubuntu-latest

    steps:
      - name: Create Task subissues attached to Epic
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // Only proceed if issue type is Epic
            if (!issue.type || issue.type.name !== 'Epic') {
              console.log('Issue is not of type Epic. Skipping.');
              return;
            }

            console.log('Epic detected. Creating Task subissues...');

            const subissues = [
              {
                title: 'my first subissue',
                body: 'hello world!'
              },
              {
                title: 'my second subissue',
                body: 'another subtask'
              },
              {
                title: 'my third subissue',
                body: 'yet another subtask'
              }
            ];

            for (const subissue of subissues) {
              // 1) Create the child issue (Task)
              const created = await github.request('POST /repos/{owner}/{repo}/issues', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: subissue.title,
                body: subissue.body,
                issue_type: {
                  name: 'Task'
                }
              });

              console.log(`Created issue #${created.data.number} for "${subissue.title}"`);

              if (!created.data.id) {
                console.error('Failed to get created issue id; skipping linking.');
                continue;
              }

              // 2) Link the newly created issue as a sub-issue of the Epic
              await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                sub_issue_id: created.data.id
              });

              console.log(`Linked created issue #${created.data.number} as a Task subissue of Epic #${issue.number}`);
            }
