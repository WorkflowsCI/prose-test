name: Create subissues for Epic issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create-subissues:
    runs-on: ubuntu-latest

    steps:
      - name: Create Task subissues attached to Epic
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // Only proceed if issue type is Epic
            if (!issue.type || issue.type.name !== 'Epic') {
              console.log('Issue is not of type Epic. Skipping.');
              return;
            }

            console.log('Epic detected. Creating Task subissues...');

            const subissues = [
              {
                title: 'my first subissue',
                body: 'hello world!'
              },
              {
                title: 'my second subissue',
                body: 'another subtask'
              },
              {
                title: 'my third subissue',
                body: 'yet another subtask'
              }
            ];

            for (const subissue of subissues) {
              gh api graphql -H GraphQL-Features:issue_types -H GraphQL-Features:sub_issues -f parrentIssueId="$parent_issue_id" -f childIssueId="$child_issue_id" -f query='
                mutation($parrentIssueId: ID!, $childIssueId: ID!) {
                  addSubIssue(input: { issueId: $parrentIssueId, subIssueId: $childIssueId }) {
                    issue {
                      title
                      number
                      url
                      id
                      issueType {
                        name
                      }
                    }
                    subIssue {
                      title
                      number
                      url
                      id
                      issueType {
                        name
                      }
                    }
                  }
                }
              };

              console.log(`Created Task subissue: ${subissue.title}`);
            }
