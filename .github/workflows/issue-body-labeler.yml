name: Label Issues From Body

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply labels from issue body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.github/issue-labeler.yml';
            const body = context.payload.issue.body || '';

            function unquote(value) {
              const trimmed = value.trim();
              if (
                (trimmed.startsWith('"') && trimmed.endsWith('"')) ||
                (trimmed.startsWith("'") && trimmed.endsWith("'"))
              ) {
                return trimmed.slice(1, -1);
              }

              return trimmed;
            }

            function parseConfig(source) {
              const config = {
                version: 1,
                appendOnly: true,
                labels: [],
              };

              let currentRule = null;

              for (const rawLine of source.split(/\r?\n/)) {
                const line = rawLine.trim();
                if (!line || line.startsWith('#')) {
                  continue;
                }

                if (line.startsWith('version:')) {
                  config.version = Number(line.slice('version:'.length).trim());
                  continue;
                }

                if (line.startsWith('appendOnly:')) {
                  config.appendOnly = line.slice('appendOnly:'.length).trim() === 'true';
                  continue;
                }

                const labelMatch = line.match(/^- label:\s*(.+)$/);
                if (labelMatch) {
                  currentRule = { label: unquote(labelMatch[1]) };
                  config.labels.push(currentRule);
                  continue;
                }

                const bodyMatch = line.match(/^body:\s*(.+)$/);
                if (bodyMatch && currentRule) {
                  currentRule.body = unquote(bodyMatch[1]);
                }
              }

              return config;
            }

            function matchesRule(rule, issueBody) {
              if (!rule.body) {
                return false;
              }

              try {
                return new RegExp(rule.body, 'i').test(issueBody);
              } catch (error) {
                core.warning(`Invalid regex for label "${rule.label}": ${rule.body}`);
                return false;
              }
            }

            const configSource = fs.readFileSync(path, 'utf8');
            const config = parseConfig(configSource);

            if (config.version !== 1) {
              core.setFailed(`Unsupported config version: ${config.version}`);
              return;
            }

            const matchingLabels = config.labels
              .filter((rule) => matchesRule(rule, body))
              .map((rule) => rule.label);

            if (matchingLabels.length === 0) {
              core.info('No matching labels found for this issue body.');
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            );
            const availableLabels = new Set(repoLabels.map((label) => label.name));
            const labelsToApply = matchingLabels.filter((label) => availableLabels.has(label));
            const missingLabels = matchingLabels.filter((label) => !availableLabels.has(label));

            for (const label of missingLabels) {
              core.warning(`Label "${label}" does not exist in ${owner}/${repo}; skipping.`);
            }

            if (labelsToApply.length === 0) {
              core.info('Matches were found, but none of the labels exist in the repository.');
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: labelsToApply,
            });

            core.info(`Applied labels: ${labelsToApply.join(', ')}`);
