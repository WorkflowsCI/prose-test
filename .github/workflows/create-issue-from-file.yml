name: Create issues from .md files

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create-subissues:
    runs-on: ubuntu-latest

    steps:
      - name: Create isse from file
        uses: actions/github-script@v7
      - run: gh issue create --body-file ../ISSUE_TEMPLATE/epics/test.md
