name: shopware-cli

on:
  workflow_dispatch:

jobs:
  shopware-cli:
    runs-on: ubuntu-24.04

    steps:
      - name: Install shopware-cli
        uses: shopware/shopware-cli-action@v3

      - name: Install Shopware
        run: |
          shopware-cli project create platform dev-trunk --ci github --docker
          cd platform
          docker compose up -d
          docker compose run --rm web bash bin/console system:install --basic-setup
