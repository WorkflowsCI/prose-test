name: shopware-cli

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shopware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          repository: shopware/shopware
          path: main


      - name: Install shopware-cli
        uses: shopware/shopware-cli-action@v3

      - name: Create CI Docker project
        run: shopware-cli project create platform --docker --no-interaction --ci github

      - name: Copy Shopware tests
        run: cp -r main/tests platform

      - name: Install dependencies
        run: |
          cd platform/tests/acceptance
          npm config set fetch-retries=5 fetch-retry-mintimeout=20000
          npm ci
          
      - name: Start Docker containers
        run: |
          cd ~/platform
          docker compose up -d
