name: shopware-cli

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shopware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          repository: shopware/shopware
          path: main


      - name: Install shopware-cli
        uses: shopware/shopware-cli-action@v3

      - name: Create CI Docker project
        run: shopware-cli project create platform --docker --no-interaction --ci github

      - name: Copy Shopware tests
        run: cp -r main/tests platform

      - name: Install dependencies
        run: |
          cd platform/tests/acceptance
          npm config set fetch-retries=5 fetch-retry-mintimeout=20000
          npm ci
          
      - name: Start Docker containers (github runner resets to main workspace between steps)
        run: |
          cd platform
          docker compose up -d

      - name: Playwright + visual tests
        run: |
          cd platform/tests/acceptance
          PLAYWRIGHT_VERSION=$(jq -r '.packages["node_modules/playwright-core"].version' package-lock.json)
          docker run --rm \
            --ipc=host \
            --init \
            --network=host \
            --user "$(id -u):$(id -g)" \
            -e APP_URL=http://localhost:8000 \
            -e SHOPWARE_ADMIN_USERNAME=admin \
            -e SHOPWARE_ADMIN_PASSWORD=shopware \
            -e CURRENTS_PROJECT_ID \
            -e CURRENTS_RECORD_KEY \
            -e CURRENTS_BUILD_ID \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app/tests/acceptance \
            "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble" \
            npx playwright test --project=Visual --workers=1
