name: Run playwright in Docker

on:
  workflow_dispatch:

jobs:
  visual-admin:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Shopware repo
        uses: actions/checkout@master
        with:
          repository: shopware/shopware

      - name: Install Playwright dependencies
        working-directory: tests/acceptance
        run: npm ci

      - name: Start Shopware containers
        run: docker compose up -d

      - name: Install Shopware
        run: |
          docker compose exec -T -u root web composer setup
          docker compose exec -T -u root web composer run npm:storefront run production
          # (cd src/Storefront/Resources/app/storefront && node copy-to-vendor.js)

      - name: Run Admin visual tests in Playwright container
        working-directory: tests/acceptance
        run: |
          docker run --rm \
            --ipc=host \
            --init \
            --add-host=host.docker.internal:host-gateway \
            -e APP_URL=http://host.docker.internal:8000 \
            -e SHOPWARE_ADMIN_USERNAME=admin \
            -e SHOPWARE_ADMIN_PASSWORD=shopware \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app/tests/acceptance \
            mcr.microsoft.com/playwright:v1.58.1-noble \
            npx playwright test --project=Visual --grep Storefront

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            tests/acceptance/test-results/
            tests/acceptance/playwright-report/
          retention-days: 3
