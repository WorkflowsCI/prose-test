name: Add needs-triage label to new PullRequests and Issues

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  needs-triage:
    runs-on: ubuntu-24.04
    steps:
      - name: Has labels
        id: applied-labels
        #if:  github.event.issue.labels.*.name
        #if: ${{ contains(github.event.issue.labels.*.name) && startsWith(github.event.issue.labels.*.name, 'component')) }}
        #if: ! startsWith(github.event.issue.labels.*.name, 'component')
        run: echo "${{ applied_labels = fromJSON(github.event.issue.labels.*.name) }}" >> $GITHUB_ENV #prints out list of labels
        
        #run: echo "${{ join(github.event.issue.labels.*.name) }}" #not sure how join works
        ##failed: if: contains(fromJSON(github.event.issue.labels.*.name), startsWith(fromJSON(github.event.issue.labels.*.name), 'component'))
      - name: whats it even doing
        #if: startsWith(github.event.issue.labels.*.name, 'component')
        #run: echo "${{ ! startsWith(github.event.issue.labels.*.name, 'domain') }}"
        run: echo "${{ env.applied_labels }}"
        
        #- name: any domain 
        #run: echo "${{ startsWith(fromJSON(github.event.issue.labels.*.name), 'domain') }}"

      - name: Add needs-triage label
        uses: srvaroa/labeler@v1.13.0
        if: ! startsWith(github.event.issue.labels.*.name, 'domain') #not case sensitive
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          config_path: .github/labeler-needs-triage.yml
