name: FINAL - Conditional subissues for Epic issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  
jobs:
  subissues-tests:
      runs-on: ubuntu-latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EPIC_NUM: ${{ github.event.issue.number }}
        REPO: ${{ github.repository }}
      if: github.event.issue.type.name =='Epic' && !contains(github.event.issue.body, 'Backend-only work required') 
      steps:
      - name: Define api call to add subissues
        run: echo "ADD_SUBISSUE_API=/repos/$REPO/issues/$EPIC_NUM/sub_issues" >> $GITHUB_ENV

      - name: Create list of all markdown files from Design
        run: | 
          FILES=$(gh api --jq '.[].name' /repos/$REPO/contents/.github/ISSUE_TEMPLATE/Design | grep '.md' | sed 's|^|Design/|' )
          {
            echo "MY_FILELIST_ACC<<EOF"
            echo "${FILES}"
            echo "EOF"
          } >> "$GITHUB_ENV"
      
      - name: Create list of all markdown files from Epic
        if: "!contains(github.event.issue.body, 'Requires frontend work -only- in the Admin')"
        run: | 
          FILES=$(gh api --jq '.[].name' /repos/$REPO/contents/.github/ISSUE_TEMPLATE/Epic | grep '.md' | sed 's|^|Epic/|')
          {
            echo "MY_FILELIST_ACC<<EOF"
            echo "${MY_FILELIST_ACC}"
            echo "${FILES}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create issue for each markdown file and attach as subissue to newly created epic
        run: |
          for file in $MY_FILELIST_ACC; do
        
            # set title to file name and remove file extension 
            TITLE=${file%%.*}
            # replace hyphens with spaces
            TITLE="${TITLE//-/ }"

            # create subissue and get subissue number
            SUBISSUE=$(gh issue create --title "$TITLE" --body-file ".github/ISSUE_TEMPLATE/${file}")
            SUBISSUE_NUM=$(gh issue view $SUBISSUE --json number --jq '.number')

            # get subissue database id
            # source: https://jessehouwing.net/create-github-issue-hierarchy-using-the-api/
            SUBISSUE_ID=$(gh api /repos/$REPO/issues/$SUBISSUE_NUM --jq .id)

            # add subissue to epic
            gh api -X POST $ADD_SUBISSUE_API -F sub_issue_id=$SUBISSUE_ID

            # set subissue type
            gh api -X PATCH /repos/$REPO/issues/$SUBISSUE_NUM --field type="Task" 
          done  
