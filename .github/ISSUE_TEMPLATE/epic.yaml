name: Am an Epic
description: Describe this issue template's purpose here.
title: Am an Epic
type: Epic
body:
    - type: markdown
      attributes:
          value: This is going to be an amazing feature.
    - type: checkboxes
      id: def-of-done
      attributes:
        label: Will this be super cool
        description: Please use this checklist to indicate standards.
        options:
          - label: This will definitely be cool
    - type: dropdown
      id: accessibility
      attributes:
        label: accessibility
        description: Will this Epic require frontend work in the Storefront, a brand new UI, or build upon any UI outside the Admin?
        options:
            - Yes
            - No
        default: 0
      validations:
        required: true
